[package]
name = "display-switch"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

# Exécutable distribué : DisplaySwitch.exe, comme la version Python.
[[bin]]
name = "DisplaySwitch"
path = "src/main.rs"

# Version distribuée : optimisée pour la taille, sans symboles de débogage.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
